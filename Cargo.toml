[workspace]
resolver = "2"
members = ["crates/aap", "crates/link", "crates/server", "crates/demo"]
# the firmware has a target and a toolchain of its own (see esp32/README.md)
exclude = ["esp32"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[profile.release]
lto = true
codegen-units = 1
