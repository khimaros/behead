; enables every hardware button, so key presses on the virtual display
; reach the phone as button events. openauto leaves them all off by default.
[Input]
EnableTouchscreen=true
PlayButton=true
PauseButton=true
TogglePlayButton=true
NextTrackButton=true
PreviousTrackButton=true
HomeButton=true
PhoneButton=true
CallEndButton=true
VoiceCommandButton=true
LeftButton=true
RightButton=true
UpButton=true
DownButton=true
ScrollWheelButton=true
BackButton=true
EnterButton=true
NavButton=true
